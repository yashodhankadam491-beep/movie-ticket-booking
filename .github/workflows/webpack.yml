name: Node.js CI

on:
  push:
    branches: [ "main", "add-production-security" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.5+
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.0

      - name: Install dependencies
        run: npm install

      - name: Check server.js syntax
        run: node --check server.js

      - name: Check script.js syntax
        run: node --check script.js

      - name: Check backup script syntax
        run: node --check scripts/backup-db.js

      - name: Verify package scripts
        run: npm run
